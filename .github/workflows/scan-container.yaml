name: Vulnerability Scan
on:

  schedule:
    - cron: '31 19 * * *'
    - cron: '31 7 * * *'
    - cron: '23 * * * *'
    - cron: '0/59 * * * *'

  workflow_dispatch:
    inputs:
      version:
        description: 'Image tag to scan'
        required: false
        default: 'latest'
        type: string

permissions:
  packages: read
  security-events: write
  
jobs:  
  scan:
    name: Scan container image
    strategy:
      matrix:
        workload: ["controller", "server", "web-hooks"]
        version: ["latest", "0.36.0", "0.35.0", "0.34.0", "0.33.0", "0.32.0", "0.31.0", "0.30.0"]
    runs-on: ubuntu-26.04
    steps:
      - name: Run trivy scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/sap/cap-operator/${{ matrix.workload }}:${{ matrix.version }}
          scanners: 'vuln'
          version: 'v0.74.0'
          format: 'sarif'
          output: 'vuln-${{ matrix.workload }}.sarif'

      - name: Upload trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'vuln-${{ matrix.workload }}.sarif'

      - name: Run grype scanner
        uses: anchore/scan-action@v7
        with:
          fail-build: false
          grype-version: v0.118.0
          image: ghcr.io/sap/cap-operator/${{ matrix.workload }}:${{ matrix.version }}
          output-file: 'vuln-grype-${{ matrix.workload }}.sarif'

      - name: Upload grype scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'vuln-grype-${{ matrix.workload }}.sarif'
